<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1746d1">
  <title>Nidal Junior — Pilotage contenu</title>
  <meta name="description" content="Planning, performance et controle des contenus Facebook et Instagram de Nidal Junior">
  <link rel="icon" type="image/png" href="./assets/mascot.png">
  <link rel="stylesheet" href="./css/style.css">
  <script src="./js/utils.js" defer></script>
  <script src="./js/api.js" defer></script>
  <script src="./js/store.js" defer></script>
  <script src="./js/charts.js" defer></script>
  <script src="./js/export.js" defer></script>
  <script src="./js/dashboard.js" defer></script>
  <script src="./js/planning.js" defer></script>
  <script src="./js/contents.js" defer></script>
  <script src="./js/agent.js" defer></script>
  <script src="./js/performance.js" defer></script>
  <script src="./js/insights.js" defer></script>
  <script src="./js/quality.js" defer></script>
  <script src="./js/app.js" defer></script>
</head>
<body>
  <a href="#main-content" class="skip-link">Aller au contenu principal</a>
  <div class="app-layout">
    <aside class="sidebar" aria-label="Navigation principale">
      <div class="sidebar__brand">
        <img src="./assets/logo.jpg" alt="Logo Nidal Etablissement Prive" class="sidebar__logo-img">
        <strong>Nidal Junior</strong>
        <span>Pilotage contenu</span>
        <label class="brand-switch-label" for="brand-switch">MARQUE ACTIVE</label>
        <select id="brand-switch" class="brand-switch"><option value="nidal-junior">Nidal Junior</option><option value="nidal">Nidal</option></select>
      </div>
      <nav class="sidebar__nav">
        <button class="nav-item active" data-view="dashboard" aria-current="page"><span>Vue d’ensemble</span><b>01</b></button>
        <button class="nav-item" data-view="planning"><span>Planning</span><b>02</b></button>
        <button class="nav-item" data-view="contents"><span>Contenus</span><b>03</b></button>
        <button class="nav-item" data-view="agent"><span>Agent IA</span><b>04</b></button>
        <button class="nav-item" data-view="performance"><span>Performance</span><b>05</b></button>
        <button class="nav-item" data-view="insights"><span>Insights Meta</span><b>06</b></button>
        <button class="nav-item" data-view="quality"><span>Controle</span><b>07</b></button>
      </nav>
      <div class="sidebar__character" aria-hidden="true"><img src="./assets/mascot.png" alt=""></div>
      <div class="sidebar__footer"><button class="theme-toggle" id="theme-toggle" aria-label="Changer le theme"><span id="theme-icon">◐</span><span class="theme-toggle__label">Mode sombre</span></button><div class="brand-links"><span>@GSNIDAL</span><span>GSNIDAL.MA</span><small>PLUS QU’UNE ECOLE, UN AVENIR</small></div></div>
    </aside>
    <main class="main-content" id="main-content" tabindex="-1">
      <div class="view-panel active" id="view-dashboard"></div>
      <div class="view-panel" id="view-planning" hidden></div>
      <div class="view-panel" id="view-contents" hidden></div>
      <div class="view-panel" id="view-agent" hidden></div>
      <div class="view-panel" id="view-performance" hidden></div>
      <div class="view-panel" id="view-insights" hidden></div>
      <div class="view-panel" id="view-quality" hidden></div>
    </main>
    <nav class="mobile-nav" aria-label="Navigation mobile">
      <button class="mobile-nav__item active" data-view="dashboard"><span>Vue</span></button>
      <button class="mobile-nav__item" data-view="planning"><span>Planning</span></button>
      <button class="mobile-nav__item" data-view="contents"><span>Contenus</span></button>
      <button class="mobile-nav__item" data-view="agent"><span>Agent</span></button>
      <button class="mobile-nav__item" data-view="performance"><span>KPI</span></button>
      <button class="mobile-nav__item" data-view="insights"><span>Insights</span></button>
      <button class="mobile-nav__item" data-view="quality"><span>Controle</span></button>
    </nav>
  </div>
  <div class="modal-overlay" id="modal-overlay" hidden><div id="modal-container"></div></div>
  <div class="toast-container" id="toast-container" aria-live="polite" aria-atomic="true"></div>
  <div id="sr-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
